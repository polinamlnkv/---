<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <title>Калькулятор — Discord style</title>
  <link rel="stylesheet" href="style.css">
  <script type="text/javascript" src="script.js"></script>
</head>

<body>

  <!-- шапка страницы, оформленная в стиле хедера discord.com -->
  <header class="site-header">
    <div class="logo">Calcy<span class="logo-accent">•</span></div>
    <nav class="site-nav">
      <a href="#" class="nav-link">Скачать</a>
      <a href="#" class="nav-link">Возможности</a>
      <a href="about.html" class="nav-link">О проекте</a>
    </nav>
    <a href="#" class="nav-btn">Открыть в браузере</a>
  </header>

  <main class="page-wrap">

    <div class="calc-card">

      <!-- выпадающий список выбора темы оформления -->
      <label for="theme-select" class="theme-label">Тема интерфейса</label>
      <select id="theme-select" class="theme-select">
        <option value="dark" selected>Discord Dark</option>
        <option value="light">Discord Light</option>
        <option value="midnight">Полночный Blurple</option>
      </select>

      <!-- поле вывода результата вычислений -->
      <div id="result" class="result">
        0
      </div>

      <!-- блок с кнопками калькулятора -->
      <div class="keys">

        <div class="keys-row">
          <button id="btn_op_clear" class="my-btn secondary">C</button>
          <button id="btn_op_sign" class="my-btn secondary">+/-</button>
          <button id="btn_op_percent" class="my-btn secondary">%</button>
          <button id="btn_op_div" class="my-btn primary">/</button>
        </div>

        <div class="keys-row">
          <button id="btn_digit_7" class="my-btn">7</button>
          <button id="btn_digit_8" class="my-btn">8</button>
          <button id="btn_digit_9" class="my-btn">9</button>
          <button id="btn_op_mult" class="my-btn primary">x</button>
        </div>

        <div class="keys-row">
          <button id="btn_digit_4" class="my-btn">4</button>
          <button id="btn_digit_5" class="my-btn">5</button>
          <button id="btn_digit_6" class="my-btn">6</button>
          <button id="btn_op_minus" class="my-btn primary">-</button>
        </div>

        <div class="keys-row">
          <button id="btn_digit_1" class="my-btn">1</button>
          <button id="btn_digit_2" class="my-btn">2</button>
          <button id="btn_digit_3" class="my-btn">3</button>
          <button id="btn_op_plus" class="my-btn primary">+</button>
        </div>

        <div class="keys-row">
          <button id="btn_digit_0" class="my-btn zero">0</button>
          <button id="btn_digit_dot" class="my-btn">.</button>
          <button id="btn_op_equal" class="my-btn execute">=</button>
        </div>

        <!-- собственная "прикольная" функция: удваивает число, как Discord Nitro Boost -->
        <div class="keys-row">
          <button id="btn_op_boost" class="my-btn boost">⚡ Nitro Boost ×2</button>
        </div>

      </div>
    </div>

    <p class="footer-note">ЛР выполнена: Фамилия Имя Отчество, группа ХХ-ХХ</p>

  </main>

</body>
</html>
